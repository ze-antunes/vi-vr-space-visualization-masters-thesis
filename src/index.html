<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore satellite conjunction snapshots and compare avoidance manoeuvres on desktop and in WebXR." />
  <title>VR Satellite Visualization</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <a-scene id="myScene" renderer="antialias: true; colorManagement: true" background="color: #000011" loading-screen="enabled: false" xr-mode-ui="XRMode: vr">
    <a-entity id="collisionBox" position="0 1.5 -1.5">
      <a-entity id="globe" scale="0.7 0.7 0.7">
        <a-entity id="globe-target"></a-entity>
        <a-entity id="globe-target-posmanoeuvre"></a-entity>
        <a-entity id="globe-chaser"></a-entity>
      </a-entity>
      <a-entity id="room" visible="false">
        <a-entity id="room-conjunction">
          <a-entity id="room-target"></a-entity>
          <a-entity id="room-target-posmanoeuvre"></a-entity>
          <a-entity id="room-chaser"></a-entity>
        </a-entity>
      </a-entity>
    </a-entity>
    <a-entity id="myCamera" camera="fov: 60" position="0 1.6 0" look-controls wasd-controls></a-entity>
    <a-entity id="rightController" meta-touch-controls="hand: right">
      <a-entity line="start: 0 0 0; end: 0 0 -3; color: #81c9ff; opacity: 0.5"></a-entity>
    </a-entity>
    <a-entity id="leftController" meta-touch-controls="hand: left">
      <a-entity line="start: 0 0 0; end: 0 0 -3; color: #96df92; opacity: 0.5"></a-entity>
    </a-entity>
  </a-scene>
    <!-- Loading Screen  -->
    <div id="loader" class="loadingScreen">
      <div class="load">
        <div class="scene">
          <div class="shadow"></div>
          <div class="jumper">
            <div class="spinner">
              <div class="scaler">
                <div class="loader">
                  <div class="cuboid">
                    <div class="cuboid__side"></div>
                    <div class="cuboid__side"></div>
                    <div class="cuboid__side"></div>
                    <div class="cuboid__side"></div>
                    <div class="cuboid__side"></div>
                    <div class="cuboid__side"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="progress-bar-container">
        <label id="progress-bar-label" for="progress-bar">0 %</label>
        <progress id="progress-bar" value="0" max="100"></progress>
      </div>
      <p id="loading-error" role="alert"></p>
      <button id="retry" hidden>Try again</button>
    </div>

  <script type="module" src="./script.js"></script>
</body>
</html>
